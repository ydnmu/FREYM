[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/freym-app"]

[workspace.package]
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
frame-contracts = { path = "crates/frame-contracts" }
frame-capture = { path = "crates/frame-capture" }
frame-audio = { path = "crates/frame-audio" }
frame-clock = { path = "crates/frame-clock" }
frame-metadata = { path = "crates/frame-metadata" }
frame-encode = { path = "crates/frame-encode" }
frame-mux = { path = "crates/frame-mux" }
frame-metrics = { path = "crates/frame-metrics" }
frame-settings = { path = "crates/frame-settings" }
frame-core = { path = "crates/frame-core" }
frame-runtime = { path = "crates/frame-runtime" }
freym-ui = { path = "crates/freym-ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "eec3376016e83b79a574039fb66107d3801741f6", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "eec3376016e83b79a574039fb66107d3801741f6", features = ["font-kit", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev.package.frame-windows]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

# Keep line tables while bounding MSVC test PDB size for the largest UI crates.
[profile.test.package.freym-ui]
debug = "limited"

[profile.test.package.gpui]
debug = "limited"
