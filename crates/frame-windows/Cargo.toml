[package]
name = "frame-windows"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
frame-metadata.workspace = true
frame-contracts.workspace = true
frame-capture.workspace = true
frame-audio.workspace = true
frame-encode.workspace = true
frame-clock.workspace = true
frame-metrics.workspace = true
frame-settings.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
flate2 = "1.1.10"
windows-core = "0.61.2"
libloading = "=0.7.4"
windows = { version = "0.61.3", features = [
    "Foundation",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
cc = "1"

[dev-dependencies]
frame-mux.workspace = true
opus = "=0.4.0"

[lints.rust]
unsafe_code = 'deny'
unsafe_op_in_unsafe_fn = 'deny'

[lints.clippy]
all = 'warn'
