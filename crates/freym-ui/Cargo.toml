[package]
name = "freym-ui"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
ui-preview = []

[dependencies]
gpui.workspace = true
frame-contracts.workspace = true
frame-audio.workspace = true
frame-runtime.workspace = true
frame-studio = { path = "../frame-studio" }
frame-settings.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2"
raw-window-handle = "0.6"
anyhow = "1"
dirs-next = "2"
unicode-segmentation = "1"
freym-platform = { path = "../freym-platform" }
freym-update = { path = "../freym-update" }

[target.'cfg(target_os = "windows")'.dependencies]
frame-windows = { path = "../frame-windows" }

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
frame-clock.workspace = true
