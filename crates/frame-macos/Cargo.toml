[package]
name = "frame-macos"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Type-check the Rust native seam on a non-Mac host; does not compile Apple SDK code.
native-typecheck = []

[dependencies]
frame-contracts.workspace = true
frame-capture.workspace = true
frame-audio.workspace = true
frame-encode.workspace = true
frame-clock.workspace = true
serde_json.workspace = true
serde.workspace = true

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = 'deny'

[lints.clippy]
all = 'warn'
