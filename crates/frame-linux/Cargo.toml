[package]
name = "frame-linux"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
frame-metadata.workspace = true
frame-contracts.workspace = true
frame-capture.workspace = true
frame-audio.workspace = true
frame-encode.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
frame-clock.workspace = true
frame-mux.workspace = true
frame-settings.workspace = true
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "tokio"] }
futures-util = "0.3"
gstreamer = "0.24.4"
gstreamer-app = "0.24.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[lints.rust]
unsafe_code = 'deny'
unsafe_op_in_unsafe_fn = 'deny'

[lints.clippy]
all = 'warn'
